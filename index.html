<!doctype html>
<html lang="ru" style="background-color: #0b111e; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b111e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b111e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b111e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Наизусть" />
    
    <!-- Иконки приложения -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <title>Наизусть — Заучивание стихов Библии</title>
    <meta name="description" content="Приложение для заучивания библейских стихов наизусть с интервальными повторениями и разнообразными упражнениями." />
    <meta property="og:title" content="Наизусть — Заучивание стихов Библии" />
    <meta property="og:description" content="Приложение для заучивания библейских стихов наизусть с интервальными повторениями и разнообразными упражнениями." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Встроенные стили для мгновенного экрана загрузки (0мс задержки до выполнения JS) -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #0b111e;
        color: #f8fafc;
        overflow-x: clip;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .initial-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.1) 0%, rgba(11, 17, 30, 1) 75%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        z-index: 99999;
      }
      .splash-icon-box {
        position: relative;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-aura {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 32px;
        background: rgba(245, 158, 11, 0.22);
        filter: blur(20px);
        animation: splashGlow 2s ease-in-out infinite alternate;
      }
      .splash-icon-img {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 22px;
        border: 1px solid rgba(245, 158, 11, 0.35);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(245, 158, 11, 0.25);
        object-fit: contain;
        background-color: #0f172a;
      }
      .splash-app-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #fef3c7 0%, #fbbf24 60%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 20px rgba(245, 158, 11, 0.2);
      }
      .splash-quote {
        margin-top: 8px;
        font-size: 13px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.02em;
        text-align: center;
        padding: 0 24px;
      }
      .splash-bar-wrap {
        margin-top: 32px;
        width: 140px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(51, 65, 85, 0.6);
        overflow: hidden;
        position: relative;
      }
      .splash-bar-fill {
        position: absolute;
        inset-block: 0;
        width: 45%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #f59e0b, #fef08a);
        animation: splashBarMove 1.2s infinite ease-in-out;
      }
      .splash-loading-text {
        margin-top: 12px;
        font-size: 11px;
        font-weight: 500;
        color: rgba(148, 163, 184, 0.6);
        letter-spacing: 0.05em;
      }
      @keyframes splashGlow {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes splashBarMove {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(60%); }
        100% { transform: translateX(230%); }
      }
    </style>
  </head>
  <body style="background-color: #0b111e;">
    <div id="root">
      <!-- Мгновенный экран загрузки до инициализации React -->
      <div class="initial-splash">
        <div class="splash-icon-box">
          <div class="splash-aura"></div>
          <img src="/pwa-192x192.png" alt="Библия" class="splash-icon-img" width="96" height="96" />
        </div>
        <div class="splash-app-title">Наизусть</div>
        <div class="splash-quote">«Слово Твоё — светильник ноге моей»</div>
        <div class="splash-bar-wrap">
          <div class="splash-bar-fill"></div>
        </div>
        <div class="splash-loading-text">Запуск приложения…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
